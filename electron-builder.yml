appId: com.vencordutil.app
productName: Vencord Util
copyright: Copyright © curet-dev – GPL-3.0-or-later
directories:
    output: release
    buildResources: build
files:
    - out/**/*
    - build/icon.png
    - build/icon-win.png
    - package.json
asar: true
publish: null
# The UI is English – only ship Chromium's English and German strings (saves ~47 MB of locale files).
electronLanguages:
    - en-US
    - de
compression: maximum

win:
    icon: build/icon-win.png
    target:
        - target: nsis
          arch: [x64, arm64]
        - target: portable
          arch: [x64]

nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    shortcutName: Vencord Util
    # One installer per architecture instead of an additional ~240 MB installer that contains both.
    buildUniversalInstaller: false
    artifactName: VencordUtil-${version}-win-${arch}-setup.${ext}

portable:
    artifactName: VencordUtil-${version}-win-${arch}-portable.${ext}

mac:
    icon: build/icon.png
    category: public.app-category.utilities
    target:
        # Separate Intel and Apple Silicon images – a universal build contains both and is twice as large.
        - target: dmg
          arch: [x64, arm64]
    identity: "-"
    hardenedRuntime: false
    artifactName: VencordUtil-${version}-mac-${arch}.${ext}

dmg:
    title: Vencord Util ${version}
