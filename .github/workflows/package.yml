name: Package

on:
    workflow_call:
        inputs:
            retention-days:
                type: number
                default: 14

permissions:
    contents: read

jobs:
    package:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Windows
                      os: windows-latest
                      target: --win
                      artifact: windows
                    - name: macOS
                      os: macos-latest
                      target: --mac
                      artifact: macos
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npx electron-builder ${{ matrix.target }} --publish never
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
            - uses: actions/upload-artifact@v7
              with:
                  name: vencord-util-${{ matrix.artifact }}
                  path: |
                      release/*.exe
                      release/*.dmg
                  if-no-files-found: error
                  retention-days: ${{ inputs.retention-days }}
